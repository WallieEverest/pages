<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slideshow</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slideshow">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #fff;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  #stage { position: fixed; inset: 0; }
  .slide {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0; transition: opacity var(--fade, 1s) ease;
  }
  .slide.show { opacity: 1; }
  body.cover .slide { object-fit: cover; }
  body.kenburns .slide.show { animation: kb var(--dur, 6s) linear forwards; }
  @keyframes kb { from { transform: scale(1); } to { transform: scale(1.08) translate(-1%, -1%); } }

  .ui { position: fixed; left: 0; right: 0; transition: opacity 0.3s; z-index: 2; }
  body.hide-ui .ui { opacity: 0; pointer-events: none; }
  .bar-top {
    top: 0; padding: calc(env(safe-area-inset-top) + 10px) 16px 28px;
    background: linear-gradient(rgba(0,0,0,0.6), transparent);
    display: flex; justify-content: space-between; align-items: baseline; font-size: 15px;
  }
  .bar-bot {
    bottom: 0; padding: 32px 16px calc(env(safe-area-inset-bottom) + 14px);
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
  }

  /* Caption banner: outside the stage and the controls, so neither the slow zoom nor hiding the controls affects it */
  #banner {
    position: fixed; z-index: 1; left: var(--bl, 0px); width: var(--bw, 100%);
    bottom: max(var(--bb, 0px), env(safe-area-inset-bottom, 0px));
    padding: 0.35em 0.8em; background: rgba(0,0,0,0.45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    font-size: var(--cap); line-height: 1.3; text-align: center; text-shadow: 0 1px 2px #000; pointer-events: none;
    transition: opacity var(--fade, 1s) ease, bottom 0.3s ease, left 0.3s ease, width 0.3s ease;
  }
  #banner.off { opacity: 0; }
  #capText { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
  body { --cap: clamp(18px, 3.2vmin, 36px); }
  body.cap-S { --cap: clamp(14px, 2.4vmin, 26px); }
  body.cap-L { --cap: clamp(24px, 4.4vmin, 50px); }
  body.cap-XL { --cap: clamp(32px, 6vmin, 68px); }
  body.loading #banner { display: none; }
  .controls { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; }
  .controls button, .controls select {
    font: inherit; font-size: 15px; color: #fff; background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.25); border-radius: 22px; height: 44px; min-width: 44px; padding: 0 8px;
    -webkit-appearance: none; appearance: none;
  }
  .controls button.on { background: rgba(255,255,255,0.85); color: #000; }
  .controls button:active { opacity: 0.6; }
  #playBtn { min-width: 56px; font-size: 18px; }
  #speed { text-align: center; text-align-last: center; }
  .msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #aaa; font-size: 16px; line-height: 1.5; }
  [hidden] { display: none !important; }
  body.loading .ui { display: none; }

  .top-right { display: flex; align-items: center; gap: 12px; }
  #lockBtn { font-size: 16px; background: none; border: 0; color: #fff; min-width: 44px; min-height: 32px; text-align: right; }

  /* Passphrase screen */
  .unlock {
    position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; justify-content: center; align-items: stretch;
    gap: 14px; padding: 24px max(24px, calc(50% - 170px)); text-align: center; color: #ddd; font-size: 16px; line-height: 1.4;
    -webkit-user-select: text; user-select: text; touch-action: manipulation;
  }
  .unlock * { -webkit-user-select: text; user-select: text; touch-action: manipulation; }
  .unlock .big { font-size: 44px; }
  .unlock input[type=password] {
    font: inherit; font-size: 17px; color: #fff; background: #1c1c1e; border: 1px solid #3a3a3c;
    border-radius: 12px; padding: 12px 14px; outline: none; text-align: center;
  }
  .unlock input[type=password]:focus { border-color: #8e8e93; }
  .unlock label { font-size: 15px; color: #aaa; display: flex; gap: 8px; justify-content: center; align-items: center; }
  .unlock button { font: inherit; font-size: 17px; font-weight: 600; color: #000; background: #fff; border: 0; border-radius: 12px; padding: 12px; }
  .unlock button:disabled { opacity: 0.5; }
  #unlockErr { min-height: 22px; color: #ff9f8a; font-size: 15px; }
</style>
</head>
<body class="kenburns loading">
  <div id="stage">
    <img class="slide" id="imgA" alt="">
    <img class="slide" id="imgB" alt="">
  </div>

  <div id="banner" class="off" aria-live="polite"><span id="capText"></span></div>

  <div class="ui bar-top">
    <span id="counter"></span>
    <span class="top-right">
      <span id="status"></span>
      <button id="lockBtn" aria-label="Lock and forget passphrase" hidden>🔒</button>
    </span>
  </div>

  <div class="ui bar-bot">
    <div class="controls">
      <button id="prevBtn" aria-label="Previous">‹</button>
      <button id="playBtn" aria-label="Play or pause">▶︎</button>
      <button id="nextBtn" aria-label="Next">›</button>
      <select id="speed" aria-label="Seconds per photo">
        <option value="3">3s</option><option value="5">5s</option><option value="8">8s</option>
        <option value="15">15s</option><option value="30">30s</option><option value="60">60s</option>
      </select>
      <button id="shuffleBtn" aria-label="Shuffle">⇄</button>
      <button id="fitBtn" aria-label="Fill screen">⤢</button>
      <button id="kbBtn" aria-label="Slow zoom">⊕</button>
      <button id="capBtn" aria-label="Caption size">Aa</button>
    </div>
  </div>

  <div class="msg" id="msg">Loading photos…</div>

  <form class="unlock" id="unlock" autocomplete="on" hidden>
    <div class="big">🔒</div>
    <div>These photos are encrypted.<br>Enter the passphrase to view them.</div>
    <input type="text" name="username" value="Slideshow" autocomplete="username" hidden>
    <input id="pass" type="password" placeholder="Passphrase" autocomplete="current-password" enterkeyhint="go" required>
    <label><input type="checkbox" id="remember" checked> Remember on this device</label>
    <button type="submit">Unlock</button>
    <div id="unlockErr" role="alert"></div>
  </form>

<script src="vault.js"></script>
<script>
'use strict';

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const $ = id => document.getElementById(id);

const CAP_SIZES = ['S', 'M', 'L', 'XL'];
const prefs = Object.assign({ seconds: 5, shuffle: false, cover: false, kenburns: true, capSize: 'M' }, store.get('prefs', {}));
if (!CAP_SIZES.includes(prefs.capSize)) prefs.capSize = 'M';
const savePrefs = () => store.set('prefs', prefs);

let photos = [];     // plain: [{src, caption}]   encrypted: [{entry, caption}]
let order = [];      // indices into photos (shuffled or not)
let pos = 0;         // position in order
let playing = false, timer = null, front = $('imgA'), back = $('imgB');
let wakeLock = null, uiTimer = null;
let encKey = null;   // CryptoKey when the photos are encrypted
const mod = i => { const n = order.length; return ((i % n) + n) % n; };

/* ---------- Load the photo list ---------- */
function captionFrom(src) {
  return decodeURIComponent(src.split('/').pop().replace(/\.[^.]+$/, '')).replace(/[-_]+/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase());
}

async function loadList() {
  const r = await fetch('photos.json', { cache: 'no-cache' });
  if (!r.ok) throw new Error('Could not load photos.json (' + r.status + ')');
  const list = await r.json();
  return list.map(p => typeof p === 'string' ? { src: p } : p)
             .filter(p => p && p.src && p.show !== false)
             .map(p => ({ src: p.src, caption: p.caption !== undefined ? p.caption : captionFrom(p.src) }));
}

function buildOrder(keepCurrent) {
  const cur = order[pos];
  order = photos.map((_, i) => i);
  if (prefs.shuffle) {
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  }
  pos = keepCurrent && cur !== undefined ? Math.max(0, order.indexOf(cur)) : 0;
}

/* ---------- Encrypted mode: passphrase ---------- */
function askPassphrase(vault) {
  const f = $('unlock');
  $('msg').hidden = true; f.hidden = false;
  setTimeout(() => $('pass').focus(), 50);
  return new Promise(resolve => {
    f.onsubmit = async ev => {
      ev.preventDefault();
      const btn = f.querySelector('button');
      btn.disabled = true; $('unlockErr').textContent = 'Unlocking…';
      try {
        const key = await Vault.unlock($('pass').value, vault);
        if ($('remember').checked) await Vault.saveKey(key, vault, $('pass').value);
        $('pass').value = ''; f.hidden = true; $('msg').hidden = false;
        resolve(key);
      } catch (e) {
        $('unlockErr').textContent = e.message; $('pass').select();
      }
      btn.disabled = false;
    };
  });
}

$('lockBtn').onclick = async () => { await Vault.forgetKey(); location.reload(); };

/* ---------- Getting a displayable URL (decrypting if needed) ---------- */
const urlCache = new Map();   // photo index -> Promise<objectURL>
function getUrl(i) {
  const p = photos[i];
  if (!encKey) return Promise.resolve(p.src);
  if (!urlCache.has(i)) {
    const pr = Vault.loadPhotoBlob(encKey, p.entry).then(b => URL.createObjectURL(b));
    pr.catch(() => urlCache.delete(i));
    urlCache.set(i, pr);
    trimCache();
  }
  return urlCache.get(i);
}
function trimCache() {
  const keep = new Set([order[pos], order[mod(pos + 1)], order[mod(pos - 1)]]);
  for (const [i, pr] of urlCache) {
    if (urlCache.size <= 6) break;
    if (keep.has(i)) continue;
    urlCache.delete(i);
    pr.then(u => { if (front.src !== u && back.src !== u) URL.revokeObjectURL(u); }).catch(() => {});
  }
}

/* ---------- Showing slides ---------- */
const plainPreload = new Map();
function preload(p) {
  const i = order[mod(p)];
  if (encKey) { getUrl(i).catch(() => {}); return; }
  const src = photos[i].src;
  if (plainPreload.has(src)) return;
  const im = new Image(); im.decoding = 'async'; im.src = src;
  plainPreload.set(src, im);
  if (plainPreload.size > 6) plainPreload.delete(plainPreload.keys().next().value);
}

let showToken = 0;
async function show(newPos, instant) {
  const n = order.length;
  pos = mod(newPos);
  const my = ++showToken, p = photos[order[pos]];
  $('counter').textContent = (pos + 1) + ' / ' + n;
  clearTimeout(timer);
  let url;
  try { url = await getUrl(order[pos]); }
  catch {
    if (my === showToken) { $('status').textContent = 'Could not load photo ' + (pos + 1); if (playing) schedule(); }
    return;
  }
  if (my !== showToken) return;   // user already moved on
  const target = back;
  target.onload = () => {
    if (instant) { front.style.transition = target.style.transition = 'none'; }
    // restart Ken Burns animation on the incoming image
    target.style.animation = 'none'; void target.offsetWidth; target.style.animation = '';
    target.classList.add('show');
    front.classList.remove('show');
    [front, back] = [target, front];
    setCaption(p.caption, target);
    if (instant) requestAnimationFrame(() => { front.style.transition = back.style.transition = ''; });
  };
  target.onerror = () => { $('status').textContent = 'Could not show photo ' + (pos + 1); };
  target.src = url;
  target.alt = p.caption || '';
  preload(pos + 1); preload(pos - 1);
  if (playing) schedule();
}
const next = () => show(pos + 1);
const prev = () => show(pos - 1);

/* ---------- Caption banner ---------- */
// Set together with the photo it belongs to, so the caption never runs ahead of a slow-loading photo.
let capFor = null;   // the image the banner is placed over
function setCaption(text, img) {
  $('capText').textContent = text || '';
  $('banner').classList.toggle('off', !text);
  capFor = img;
  placeBanner();
}
// In Fit mode the banner sits on the photo's bottom edge (where it is drawn, ignoring the slow zoom);
// in Fill mode the photo covers the screen, so it runs along the screen's bottom. While the controls
// are showing it moves up above them.
function placeBanner() {
  const vw = innerWidth, vh = innerHeight, st = document.body.style;
  let left = 0, width = vw, bottom = 0;
  if (!prefs.cover && capFor && capFor.naturalWidth) {
    const s = Math.min(vw / capFor.naturalWidth, vh / capFor.naturalHeight);
    width = capFor.naturalWidth * s; left = (vw - width) / 2; bottom = (vh - capFor.naturalHeight * s) / 2;
  }
  if (!document.body.classList.contains('hide-ui')) bottom = Math.max(bottom, vh - document.querySelector('.controls').getBoundingClientRect().top + 8);
  st.setProperty('--bl', left + 'px'); st.setProperty('--bw', width + 'px'); st.setProperty('--bb', bottom + 'px');
}
addEventListener('resize', placeBanner);

/* ---------- Playback ---------- */
function schedule() { clearTimeout(timer); timer = setTimeout(next, prefs.seconds * 1000); }

async function setPlaying(on) {
  playing = on;
  $('playBtn').textContent = on ? '❚❚' : '▶︎';
  $('status').textContent = on ? '' : 'Paused';
  if (on) { schedule(); requestWake(); hideUiSoon(); }
  else { clearTimeout(timer); releaseWake(); showUi(); }
}

// Keep the screen on while playing (supported in iOS 16.4+)
async function requestWake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } }
  catch { /* not fatal: screen may dim */ }
}
function releaseWake() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && playing) requestWake(); });

function applyPrefs() {
  document.body.classList.toggle('cover', prefs.cover);
  document.body.classList.toggle('kenburns', prefs.kenburns);
  document.body.style.setProperty('--dur', (prefs.seconds + 1) + 's');
  document.body.style.setProperty('--fade', Math.min(1, prefs.seconds / 4) + 's');
  $('speed').value = String(prefs.seconds);
  $('shuffleBtn').classList.toggle('on', prefs.shuffle);
  $('fitBtn').classList.toggle('on', prefs.cover);
  $('kbBtn').classList.toggle('on', prefs.kenburns);
  CAP_SIZES.forEach(c => document.body.classList.toggle('cap-' + c, c === prefs.capSize));
  placeBanner();
}

/* ---------- Controls UI ---------- */
function showUi() { document.body.classList.remove('hide-ui'); placeBanner(); hideUiSoon(); }
function hideUi() { clearTimeout(uiTimer); document.body.classList.add('hide-ui'); placeBanner(); }
function hideUiSoon() { clearTimeout(uiTimer); if (playing) uiTimer = setTimeout(hideUi, 3000); }
function toggleUi() { document.body.classList.contains('hide-ui') ? showUi() : hideUi(); }

$('playBtn').onclick = () => setPlaying(!playing);
$('nextBtn').onclick = () => { next(); showUi(); };
$('prevBtn').onclick = () => { prev(); showUi(); };
$('speed').onchange = e => { prefs.seconds = +e.target.value; savePrefs(); applyPrefs(); if (playing) schedule(); showUi(); };
$('shuffleBtn').onclick = () => { prefs.shuffle = !prefs.shuffle; savePrefs(); applyPrefs(); buildOrder(true); show(pos, true); showUi(); };
$('fitBtn').onclick = () => { prefs.cover = !prefs.cover; savePrefs(); applyPrefs(); showUi(); };
$('kbBtn').onclick = () => { prefs.kenburns = !prefs.kenburns; savePrefs(); applyPrefs(); showUi(); };
let capBtnTimer = null;
$('capBtn').onclick = () => {
  prefs.capSize = CAP_SIZES[(CAP_SIZES.indexOf(prefs.capSize) + 1) % CAP_SIZES.length]; savePrefs(); applyPrefs(); showUi();
  $('capBtn').textContent = prefs.capSize;
  clearTimeout(capBtnTimer); capBtnTimer = setTimeout(() => { $('capBtn').textContent = 'Aa'; }, 1200);
};
document.querySelectorAll('.ui').forEach(el => el.addEventListener('touchstart', e => e.stopPropagation(), { passive: true }));

/* ---------- Gestures: swipe to change, tap to show/hide controls ---------- */
let sx = 0, sy = 0, st = 0;
$('stage').addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
$('stage').addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); }
  else if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && Date.now() - st < 400) { toggleUi(); }
});
$('stage').addEventListener('click', e => { if (!('ontouchstart' in window)) toggleUi(); });
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, select, textarea') || !photos.length) return;
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
});

/* ---------- Start ---------- */
(async () => {
  applyPrefs();
  try {
    const vault = await Vault.loadVault();
    if (vault) {
      encKey = (await Vault.loadKey(vault)) || (await askPassphrase(vault));
      $('lockBtn').hidden = false;
      $('msg').textContent = 'Loading photos…';
      const list = await Vault.loadList(encKey);
      if (!list.length) throw new Error('No photos yet. Add some with the Manager (pages/manager/).');
      photos = list.filter(e => !e.x).map(e => ({ entry: e, caption: e.c || '' }));
      if (!photos.length) throw new Error('All photos are hidden. Tick some in the Manager (pages/manager/).');
    } else {
      photos = await loadList();
      if (!photos.length) throw new Error('photos.json has no photos to show. Add some to the photos folder (or check for "show": false).');
    }
    $('msg').remove();
    document.body.classList.remove('loading');
    placeBanner();
    buildOrder(false);
    show(0, true);
    setPlaying(true);
  } catch (e) {
    $('msg').textContent = e.message;
  }
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
