<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slideshow removed</title>
<!-- The Slideshow app was removed on 2026-11-12. This page stays for a while so devices that had it installed
     clear what it saved. Boating shares this site's storage, so only the removed apps' data is touched. -->
<style>
  :root { --bg: #f2f2f7; --card: #fff; --text: #111; --muted: #6b6b70; --accent: #0a6cff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f2f2f7; --muted: #9a9aa0; --accent: #3d8bff; } }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; line-height: 1.5;
    background: var(--bg); color: var(--text);
  }
  .card { background: var(--card); border-radius: 16px; padding: 24px; max-width: 360px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 12px; color: var(--muted); }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <h1>The Slideshow app has been removed</h1>
    <p>You can delete its icon from the Home Screen: touch and hold it, then tap <b>Remove App</b>.</p>
    <p id="done">Clearing what it saved on this device…</p>
    <a href="../weather/">Open Boating</a>
  </div>
<script>
// Forget the Slideshow and Manager: settings, remembered passphrase and GitHub token, saved photos, service workers.
(async () => {
  ['prefs', 'show', 'nightOverride'].forEach(k => { try { localStorage.removeItem(k); } catch {} });
  try { indexedDB.deleteDatabase('slideshow-vault'); } catch {}
  try {
    for (const k of await caches.keys()) if (/^(slideshow|manager)-/.test(k)) await caches.delete(k);
  } catch {}
  try {
    for (const r of await navigator.serviceWorker.getRegistrations())
      if (/\/(slideshow|manager)\/$/.test(new URL(r.scope).pathname)) await r.unregister();
  } catch {}
  document.getElementById('done').textContent = 'Nothing from it is left on this device.';
})();
</script>
</body>
</html>
