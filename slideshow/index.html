<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slideshow</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slideshow">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #fff;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  #stage { position: fixed; inset: 0; }
  .slide {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0; transition: opacity var(--fade, 1s) ease;
  }
  .slide.show { opacity: 1; }

  .ui { position: fixed; left: 0; right: 0; transition: opacity 0.3s; z-index: 2; }
  .bar-top {
    top: 0; padding: calc(env(safe-area-inset-top) + 10px) 16px 28px;
    background: linear-gradient(rgba(0,0,0,0.6), transparent);
    display: flex; justify-content: space-between; align-items: baseline; font-size: 15px;
  }
  .bar-bot {
    bottom: 0; padding: 32px 16px calc(env(safe-area-inset-bottom) + 14px);
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
  }

  /* Caption banner: outside the stage and the controls, so hiding the controls doesn't affect it */
  #banner {
    position: fixed; z-index: 1; left: var(--bl, 0px); width: var(--bw, 100%);
    bottom: max(var(--bb, 0px), env(safe-area-inset-bottom, 0px));
    padding: 0.35em 0.8em; background: rgba(0,0,0,0.45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    font-size: var(--cap); line-height: 1.3; text-align: center; text-shadow: 0 1px 2px #000; pointer-events: none;
    transition: opacity var(--fade, 1s) ease, bottom 0.3s ease, left 0.3s ease, width 0.3s ease;
  }
  #banner.off { opacity: 0; }
  #capText { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
  body { --cap: clamp(18px, 3.2vmin, 36px); }
  body.cap-S { --cap: clamp(14px, 2.4vmin, 26px); }
  body.cap-L { --cap: clamp(24px, 4.4vmin, 50px); }
  body.cap-XL { --cap: clamp(32px, 6vmin, 68px); }
  body.loading #banner { display: none; }
  .controls { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; }
  .controls button, .controls select {
    font: inherit; font-size: 15px; color: #fff; background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.25); border-radius: 22px; height: 44px; min-width: 44px; padding: 0 8px;
    -webkit-appearance: none; appearance: none;
  }
  /* The menus' drop-down lists: dark, whatever the device's light or dark setting */
  .controls select { color-scheme: dark; }
  .controls option { color: #fff; background: #222; }
  .controls button.on { background: rgba(255,255,255,0.85); color: #000; }
  .controls button:active { opacity: 0.6; }
  #playBtn, #prevBtn, #nextBtn { min-width: 56px; }
  .controls svg { fill: currentColor; display: block; margin: auto; }   /* previous, play/pause and next: all 16px high */
  .ver { text-align: center; font-size: 11px; opacity: 0.45; margin-top: 8px; }
  #speed { text-align: center; text-align-last: center; }
  .msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #aaa; font-size: 16px; line-height: 1.5; }
  [hidden] { display: none !important; }
  body.loading .ui { display: none; }

  .top-right { display: flex; align-items: center; gap: 12px; }
  #lockBtn { font-size: 16px; background: none; border: 0; color: #fff; min-width: 44px; min-height: 32px; text-align: right; }

  /* Passphrase screen */
  .unlock {
    position: fixed; inset: 0; z-index: 5; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: stretch;
    gap: 14px; padding: 24px max(24px, calc(50% - 170px)); text-align: center; color: #ddd; font-size: 16px; line-height: 1.4;
    -webkit-user-select: text; user-select: text; touch-action: manipulation;
  }
  .unlock * { -webkit-user-select: text; user-select: text; touch-action: manipulation; }
  .unlock .big { font-size: 44px; }
  .unlock input[type=password] {
    font: inherit; font-size: 17px; color: #fff; background: #1c1c1e; border: 1px solid #3a3a3c;
    border-radius: 12px; padding: 12px 14px; outline: none; text-align: center;
  }
  .unlock input[type=password]:focus { border-color: #8e8e93; }
  .unlock label { font-size: 15px; color: #aaa; display: flex; gap: 8px; justify-content: center; align-items: center; }
  .unlock button { font: inherit; font-size: 17px; font-weight: 600; color: #000; background: #fff; border: 0; border-radius: 12px; padding: 12px; }
  .unlock button:disabled { opacity: 0.5; }
  #unlockErr { min-height: 22px; color: #ff9f8a; font-size: 15px; }

  /* Lock: confirm before forgetting the passphrase */
  .ask { margin: auto; width: min(320px, calc(100% - 32px)); border: 0; border-radius: 16px; padding: 20px; background: #1c1c1e; color: #ddd; text-align: center; font-size: 15px; line-height: 1.4; }
  .ask::backdrop { background: rgba(0,0,0,0.6); }
  .ask h2 { font-size: 18px; color: #fff; margin-bottom: 8px; }
  .ask .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
  .ask button { font: inherit; font-size: 16px; font-weight: 600; border: 0; border-radius: 12px; padding: 12px; background: #3a3a3c; color: #fff; }
  .ask button[value=yes] { background: #ff453a; }
  #chk { font-size: 12px; opacity: 0.7; }

  /* Night: a black screen with a dim clock and a Wake button */
  #night {
    position: fixed; inset: 0; z-index: 4; background: #000; color: #666;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
  }
  #nightClock { font-size: 44px; font-weight: 200; }
  #wakeBtn { font: inherit; font-size: 17px; color: #bbb; background: #161616; border: 1px solid #333; border-radius: 22px; padding: 10px 30px; }
  body.night .ui, body.night #banner { display: none; }
</style>
</head>
<body class="loading">
  <div id="stage">
    <img class="slide" id="imgA" alt="">
    <img class="slide" id="imgB" alt="">
  </div>

  <div id="banner" class="off" aria-live="polite"><span id="capText"></span></div>

  <div class="ui bar-top">
    <span id="counter"></span>
    <span class="top-right">
      <span id="chk"></span>
      <span id="status"></span>
      <button id="lockBtn" aria-label="Lock and forget passphrase" hidden>🔒</button>
    </span>
  </div>

  <div class="ui bar-bot">
    <div class="controls">
      <button id="prevBtn" aria-label="Previous"><svg width="22" height="16" viewBox="0 0 22 16"><path d="M22 0 11 8 22 16zM11 0 0 8 11 16z"/></svg></button>
      <button id="playBtn" aria-label="Play or pause"><svg width="14" height="16" viewBox="0 0 14 16"><path d="M0 0 14 8 0 16z"/></svg></button>
      <button id="nextBtn" aria-label="Next"><svg width="22" height="16" viewBox="0 0 22 16"><path d="M0 0 11 8 0 16zM11 0 22 8 11 16z"/></svg></button>
      <select id="speed" aria-label="Seconds per photo">
        <option value="5">5s</option><option value="10">10s</option><option value="20">20s</option>
      </select>
      <button id="capBtn" aria-label="Caption size">Aa</button>
      <button id="sleepBtn" aria-label="Sleep until morning">Sleep</button>
    </div>
    <div class="ver" data-name="Slideshow"></div>
  </div>

  <div class="msg" id="msg">Loading photos…</div>

  <div id="night" hidden>
    <div id="nightClock"></div>
    <button id="wakeBtn" type="button">Wake</button>
  </div>

  <dialog class="ask" id="lockAsk">
    <form method="dialog">
      <h2>Forget the passphrase?</h2>
      <p>The slideshow stops and asks for the passphrase again on this device.</p>
      <div class="two"><button value="no">Cancel</button><button value="yes">Forget</button></div>
    </form>
  </dialog>

  <form class="unlock" id="unlock" autocomplete="on" hidden>
    <div class="big">🔒</div>
    <div id="unlockNote">These photos are encrypted.<br>Enter the passphrase to view them.</div>
    <input type="text" name="username" value="Slideshow" autocomplete="username" hidden>
    <input id="pass" type="password" placeholder="Passphrase" autocomplete="current-password" enterkeyhint="go" required>
    <label><input type="checkbox" id="remember" checked> Remember on this device</label>
    <button type="submit">Unlock</button>
    <div id="unlockErr" role="alert"></div>
    <div class="ver" data-name="Slideshow"></div>
  </form>

<script src="vault.js"></script>
<script>
'use strict';

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const $ = id => document.getElementById(id);

// Test hooks, on this computer only: ?check=N checks every N seconds, ?at=HH:MM pretends the clock reads HH:MM now.
const LOCAL = /^(127\.0\.0\.1|localhost)$/.test(location.hostname), qs = new URLSearchParams(location.search);
const CHECK_MS = ((LOCAL && +qs.get('check')) || 60) * 1000;
let clockOffset = 0;
if (LOCAL && /^\d\d:\d\d$/.test(qs.get('at') || '')) {
  const [h, m] = qs.get('at').split(':').map(Number), d = new Date();
  d.setHours(h, m, 0, 0); clockOffset = d - Date.now();
}
const now = () => new Date(Date.now() + clockOffset);
const hm = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

const CAP_SIZES = ['S', 'M', 'L', 'XL'];
const prefs = Object.assign({ seconds: 5, capSize: 'M' }, store.get('prefs', {}));
['cover', 'kenburns', 'shuffle', 'night'].forEach(k => delete prefs[k]);   // settings that were removed
const PLAY_ICON = '<svg width="14" height="16" viewBox="0 0 14 16"><path d="M0 0 14 8 0 16z"/></svg>';
const PAUSE_ICON = '<svg width="14" height="16" viewBox="0 0 14 16"><path d="M0 0h5v16H0zM9 0h5v16H9z"/></svg>';
const SECONDS = [5, 10, 20];
if (!SECONDS.includes(prefs.seconds)) prefs.seconds = 5;
if (!CAP_SIZES.includes(prefs.capSize)) prefs.capSize = 'M';
const savePrefs = () => store.set('prefs', prefs);

let photos = [];          // photos that play: {id, caption} plus src (plain) or entry (encrypted); id = src or entry.f
let byId = new Map();
let order = [];           // photo ids in play order
let pos = 0;              // position in order
let playing = false, timer = null, front = $('imgA'), back = $('imgB'), shownId = null;
let wakeLock = null;
let vault = null, encKey = null;   // the vault.json in use and its key, when the photos are encrypted
let listSig = null;       // the photo list as last loaded (hash), to spot changes
let started = false;      // photos are showing (not the loading or passphrase screen)
let asleep = false;       // night screen showing
let pendingNewest = null; // newest photo that arrived while asleep: shown at wake
let reloadPending = false;// a new version (or the daily fresh start) waits for the next photo change
const mod = i => { const n = order.length; return ((i % n) + n) % n; };
const setPhotos = list => { photos = list; byId = new Map(list.map(p => [p.id, p])); };

/* ---------- Loading the photo list ---------- */
function captionFrom(src) {
  return decodeURIComponent(src.split('/').pop().replace(/\.[^.]+$/, '')).replace(/[-_]+/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase());
}

// Fetches a file of this app, giving up after 10 s so a weak signal never stalls anything.
// live: straight from the network (the minute check), so being offline shows as offline.
async function getFile(path, live) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), 10000);
  try { return await fetch(path, { cache: 'no-cache', signal: ac.signal, headers: live ? { 'X-Live': '1' } : {} }); }
  finally { clearTimeout(t); }
}
async function digest(buf) {
  return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', buf)), b => b.toString(16).padStart(2, '0')).join('');
}

// Each returns {sig, all, photos}: `all` lists every file the list names (hidden ones too), `photos` the ones that play.
// When the list is unchanged (same sig) only {sig} comes back.
async function loadEncrypted(live) {
  const r = await getFile('photos.enc', live);
  if (r.status === 404) return { sig: 'none', all: [], photos: [] };
  if (!r.ok) throw new Error('Could not load photos.enc (' + r.status + ')');
  const buf = await r.arrayBuffer(), sig = await digest(buf);
  if (sig === listSig) return { sig };
  const list = JSON.parse(new TextDecoder().decode(await Vault.decrypt(encKey, buf)));
  const all = Array.isArray(list) ? list.filter(p => p && p.f) : [];
  return { sig, all: all.map(e => e.f), photos: all.filter(e => !e.x).map(e => ({ id: e.f, entry: e, caption: e.c || '' })) };
}
async function loadPlain(live) {
  const r = await getFile('photos.json', live);
  if (!r.ok) throw new Error('Could not load photos.json (' + r.status + ')');
  const text = await r.text(), sig = await digest(new TextEncoder().encode(text));
  if (sig === listSig) return { sig };
  const list = JSON.parse(text).map(p => typeof p === 'string' ? { src: p } : p).filter(p => p && p.src);
  return { sig, all: list.map(p => p.src),
           photos: list.filter(p => p.show !== false).map(p => ({ id: p.src, src: p.src, caption: p.caption !== undefined ? p.caption : captionFrom(p.src) })) };
}
const loadPhotos = live => vault ? loadEncrypted(live) : loadPlain(live);
async function readVault(live) {
  const r = await getFile('vault.json', live);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('Could not load vault.json (' + r.status + ')');
  return r.json();
}


/* ---------- Resuming where it was (after an update, the daily fresh start or a restart) ---------- */
const saveState = () => store.set('show', { order, pos, paused: !playing });
function restoreOrder() {
  const s = store.get('show', null);
  order = photos.map(p => p.id);
  pos = 0;
  if (!s || !Array.isArray(s.order)) return s;
  pos = order.indexOf(s.order[s.pos]);
  if (pos < 0) pos = Math.min(Math.max(0, +s.pos || 0), order.length - 1);
  return s;
}

/* ---------- Encrypted mode: passphrase ---------- */
let asking = null;   // {vault, resolve} while the passphrase screen is up
const UNLOCK_NOTE = 'These photos are encrypted.<br>Enter the passphrase to view them.';
function askPassphrase(v, changed) {
  const f = $('unlock');
  $('unlockNote').innerHTML = changed ? 'The passphrase was changed.<br>Enter the new one.' : UNLOCK_NOTE;
  $('unlockErr').textContent = '';
  $('msg').hidden = true; f.hidden = false;
  setTimeout(() => $('pass').focus(), 50);
  return new Promise(resolve => {
    asking = { vault: v, resolve: key => { asking = null; $('pass').value = ''; f.hidden = true; resolve(key); } };
    f.onsubmit = async ev => {
      ev.preventDefault();
      const btn = f.querySelector('button');
      btn.disabled = true; $('unlockErr').textContent = 'Unlocking…';
      try {
        const key = await Vault.unlock($('pass').value, v);
        if ($('remember').checked) await Vault.saveKey(key, v, $('pass').value);
        if (asking) asking.resolve(key);
      } catch (e) {
        $('unlockErr').textContent = e.message; $('pass').select();
      }
      btn.disabled = false;
    };
  });
}

$('lockBtn').onclick = () => { $('lockAsk').returnValue = ''; $('lockAsk').showModal(); };
$('lockAsk').onclose = async () => { if ($('lockAsk').returnValue === 'yes') { await Vault.forgetKey(); location.reload(); } };

// The Manager made a new vault (new passphrase): stop, ask for the new one, then start again with the new list.
async function passphraseChanged(v) {
  let key = await Vault.loadKey(v);   // already remembered on this device (changed here)?
  if (!key) {
    clearTimeout(timer); releaseWake(); forgetPhotos();
    started = false; document.body.classList.add('loading');
    key = await askPassphrase(v, true);
  }
  vault = v; encKey = key; listSig = null; forgetPhotos();
  try {
    const got = await loadEncrypted(true);
    listSig = got.sig; setPhotos(got.photos);
    store.set('show', null); order = [];
    if (photos.length) begin(); else stopShow(got.all.length);
  } catch { listSig = null; }   // try again at the next check
}

/* ---------- Getting a displayable URL (decrypting if needed) ---------- */
const urlCache = new Map();   // photo id -> Promise<objectURL>
function getUrl(id) {
  const p = byId.get(id);
  if (!encKey) return Promise.resolve(p.src);
  if (!urlCache.has(id)) {
    const pr = Vault.loadPhotoBlob(encKey, p.entry).then(b => URL.createObjectURL(b));
    pr.catch(() => urlCache.delete(id));
    urlCache.set(id, pr);
    trimCache();
  }
  return urlCache.get(id);
}
function dropUrl(id) {
  const pr = urlCache.get(id);
  urlCache.delete(id);
  if (pr) pr.then(u => { if (front.src !== u && back.src !== u) URL.revokeObjectURL(u); }).catch(() => {});
}
function trimCache() {
  const keep = new Set([order[pos], order[mod(pos + 1)], order[mod(pos - 1)]]);
  for (const id of [...urlCache.keys()]) {
    if (urlCache.size <= 6) break;
    if (!keep.has(id)) dropUrl(id);
  }
}
// Clears decrypted photos from memory and the screen (passphrase changed).
function forgetPhotos() {
  for (const id of [...urlCache.keys()]) dropUrl(id);
  for (const im of [front, back]) { im.classList.remove('show'); im.removeAttribute('src'); }
  setCaption('', null); shownId = null;
}

/* ---------- Showing slides ---------- */
const plainPreload = new Map();
function preload(p) {
  const id = order[mod(p)];
  if (encKey) { getUrl(id).catch(() => {}); return; }
  if (plainPreload.has(id)) return;
  const im = new Image(); im.decoding = 'async'; im.src = id;
  plainPreload.set(id, im);
  if (plainPreload.size > 6) plainPreload.delete(plainPreload.keys().next().value);
}

const updateCounter = () => { $('counter').textContent = order.length ? (pos + 1) + ' / ' + order.length : ''; };

let showToken = 0;
async function show(newPos, instant) {
  if (!order.length) return;
  pos = mod(newPos);
  saveState();
  if (reloadPending) { location.reload(); return; }   // a new version: switch over between photos
  const my = ++showToken, id = order[pos], p = byId.get(id);
  updateCounter();
  clearTimeout(timer);
  let url;
  try { url = await getUrl(id); }
  catch {
    if (my === showToken) { $('status').textContent = 'Could not load photo ' + (pos + 1); if (playing) schedule(); }
    return;
  }
  if (my !== showToken) return;   // user already moved on
  const target = back;
  target.onload = () => {
    if (instant) { front.style.transition = target.style.transition = 'none'; }
    // restart Ken Burns animation on the incoming image
    target.style.animation = 'none'; void target.offsetWidth; target.style.animation = '';
    target.classList.add('show');
    front.classList.remove('show');
    [front, back] = [target, front];
    shownId = id;
    setCaption(p.caption, target);
    if (/^Could not/.test($('status').textContent)) $('status').textContent = playing ? '' : 'Paused';
    if (instant) requestAnimationFrame(() => { front.style.transition = back.style.transition = ''; });
  };
  target.onerror = () => { $('status').textContent = 'Could not show photo ' + (pos + 1); };
  target.src = url;
  target.alt = p.caption || '';
  preload(pos + 1); preload(pos - 1);
  if (playing) schedule();
}
const next = () => show(pos + 1);
const prev = () => show(pos - 1);

/* ---------- Caption banner ---------- */
// Set together with the photo it belongs to, so the caption never runs ahead of a slow-loading photo.
let capFor = null;   // the image the banner is placed over
function setCaption(text, img) {
  $('capText').textContent = text || '';
  $('banner').classList.toggle('off', !text);
  capFor = img;
  placeBanner();
}
// The banner sits on the photo's bottom edge, across its width. While the controls are showing it
// moves up above them.
function placeBanner() {
  const vw = innerWidth, vh = innerHeight, st = document.body.style;
  let left = 0, width = vw, bottom = 0;
  if (capFor && capFor.naturalWidth) {
    const s = Math.min(vw / capFor.naturalWidth, vh / capFor.naturalHeight);
    width = capFor.naturalWidth * s; left = (vw - width) / 2; bottom = (vh - capFor.naturalHeight * s) / 2;
  }
  bottom = Math.max(bottom, vh - document.querySelector('.controls').getBoundingClientRect().top + 8);
  st.setProperty('--bl', left + 'px'); st.setProperty('--bw', width + 'px'); st.setProperty('--bb', bottom + 'px');
}
addEventListener('resize', placeBanner);

/* ---------- Playback ---------- */
function schedule() { clearTimeout(timer); if (!asleep) timer = setTimeout(next, prefs.seconds * 1000); }

async function setPlaying(on) {
  playing = on;
  $('playBtn').innerHTML = on ? PAUSE_ICON : PLAY_ICON;
  $('status').textContent = on ? '' : 'Paused';
  if (on) { schedule(); requestWake(); }
  else { clearTimeout(timer); releaseWake(); }
  saveState();
}

// Keep the screen on while playing (supported in iOS 16.4+); not at night.
async function requestWake() {
  if (asleep) return;
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } }
  catch { /* not fatal: screen may dim */ }
}
function releaseWake() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  updateNight();
  if (playing) requestWake();
  check();
});

function applyPrefs() {
  document.body.style.setProperty('--fade', Math.min(1, prefs.seconds / 4) + 's');
  $('speed').value = String(prefs.seconds);
  CAP_SIZES.forEach(c => document.body.classList.toggle('cap-' + c, c === prefs.capSize));
  placeBanner();
}

/* ---------- Controls UI ---------- */

$('playBtn').onclick = () => setPlaying(!playing);
$('nextBtn').onclick = () => next();
$('prevBtn').onclick = () => prev();
$('speed').onchange = e => { prefs.seconds = +e.target.value; savePrefs(); applyPrefs(); if (playing) schedule(); };
let capBtnTimer = null;
$('capBtn').onclick = () => {
  prefs.capSize = CAP_SIZES[(CAP_SIZES.indexOf(prefs.capSize) + 1) % CAP_SIZES.length]; savePrefs(); applyPrefs();
  $('capBtn').textContent = prefs.capSize;
  clearTimeout(capBtnTimer); capBtnTimer = setTimeout(() => { $('capBtn').textContent = 'Aa'; }, 1200);
};
document.querySelectorAll('.ui').forEach(el => el.addEventListener('touchstart', e => e.stopPropagation(), { passive: true }));

/* ---------- Gestures: swipe to change ---------- */
let sx = 0, sy = 0;
$('stage').addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
$('stage').addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); }
});
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, select, textarea') || !started || asleep) return;
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
});

/* ---------- Night hours: black screen, Sleep and Wake ---------- */
// Night is from 8 PM to 8 AM. A Sleep or Wake press overrides the schedule until its next change,
// and is kept across reloads.
const NIGHT_START = 20, NIGHT_END = 8;
function inNight(d) { const h = d.getHours(); return h >= NIGHT_START || h < NIGHT_END; }
function nextAt(hour) {   // the next time the clock shows hour:00
  const d = now(), t = new Date(d);
  t.setHours(hour, 0, 0, 0);
  if (t <= d) t.setDate(t.getDate() + 1);
  return +t;
}
function shouldSleep() {
  const o = store.get('nightOverride', null);
  if (o && +now() < o.until) return o.mode === 'sleep';
  return inNight(now());
}
function updateNight() {
  const s = shouldSleep();
  $('nightClock').textContent = hm(now());
  if (s === asleep) return;
  asleep = s;
  document.body.classList.toggle('night', s);
  $('night').hidden = !s;
  if (s) { clearTimeout(timer); releaseWake(); return; }
  if (!started) return;
  if (pendingNewest && order.includes(pendingNewest)) { const id = pendingNewest; pendingNewest = null; show(order.indexOf(id)); }
  else if (playing) schedule();
  if (playing) requestWake();
}
$('sleepBtn').onclick = () => {
  store.set('nightOverride', { mode: 'sleep', until: nextAt(NIGHT_END) });
  updateNight();
};
$('wakeBtn').onclick = e => {
  e.stopPropagation();
  store.set('nightOverride', { mode: 'wake', until: nextAt(NIGHT_START) });
  updateNight();
};
setInterval(updateNight, 20000);

/* ---------- Checking for changes every minute ---------- */
let swReg = null, checking = false, lastCheck = null, offlineSince = null, ready = false;   // ready: vault.json read at startup

// A new list: drop removed and hidden photos, update captions, and jump to the newest added photo.
function applyList(got) {
  const before = new Map(photos.map(p => [p.id, p.caption || '']));
  setPhotos(got.photos);
  tidyPhotoCache(got.all);
  for (const id of [...urlCache.keys()]) if (!byId.has(id)) dropUrl(id);
  if (!photos.length) { stopShow(got.all.length); return; }
  if (!started) { begin(); return; }
  const added = photos.filter(p => !before.has(p.id)).map(p => p.id);
  const curId = order[pos];
  order = order.filter(id => byId.has(id));
  let at = order.indexOf(curId);
  const curGone = at < 0;
  if (curGone) at = Math.min(pos, order.length) - 1;   // the photo before the removed one
  const fresh = added.reverse();                       // newest (last in the list) first
  order.splice(at + 1, 0, ...fresh);
  pos = Math.max(0, at);
  if (!curGone && shownId === curId) {                 // caption edited on the photo showing
    const c = byId.get(curId).caption || '';
    if ($('capText').textContent !== c) setCaption(c, capFor);
  }
  const edited = photos.some(p => before.has(p.id) && before.get(p.id) !== (p.caption || ''));
  if (fresh.length) { if (asleep) pendingNewest = fresh[0]; else show(at + 1); }
  else if (curGone && !asleep) show(at + 1);
  else { updateCounter(); saveState(); }
  if ((fresh.length || edited) && !playing) setPlaying(true);   // new photos or a caption edit: play, even if paused
}

// No photos to play (all removed or hidden): say so, and start again when some come back.
function stopShow(any) {
  clearTimeout(timer); releaseWake(); started = false;
  document.body.classList.add('loading');
  $('msg').hidden = false;
  $('msg').textContent = any ? 'All photos are hidden. Tick some in the Manager (pages/manager/).'
    : vault ? 'No photos yet. Add some with the Manager (pages/manager/).'
    : 'photos.json has no photos to show. Add some to the photos folder (or check for "show": false).';
}

function begin() {
  const s = restoreOrder();
  started = true;
  $('msg').hidden = true;
  document.body.classList.remove('loading');
  placeBanner();
  updateNight();
  show(pos, true);
  setPlaying(!(s && s.paused));
}

// Removes cached photo files the list no longer names, so the device's storage doesn't keep growing.
async function tidyPhotoCache(files) {
  try {
    const keep = new Set(files.map(f => new URL(f, location.href).pathname));
    const c = await caches.open('slideshow-photos');
    for (const req of await c.keys()) if (!keep.has(new URL(req.url).pathname)) await c.delete(req);
  } catch { /* no cache: nothing to tidy */ }
}

async function check() {
  if (document.hidden || checking || !ready) return;
  checking = true;
  try {
    if (swReg) swReg.update().catch(() => {});
    if (vault) {
      const v = await readVault(true);
      if (asking) {
        // On the passphrase screen: if vault.json is back to one whose key this device remembers
        // (the change was undone), start again with it.
        if (v && v.salt !== asking.vault.salt && await Vault.loadKey(v)) location.reload();
        return;
      }
      if (v && v.salt !== vault.salt) { passphraseChanged(v); return; }
    }
    if (vault && !encKey) return;
    const got = await loadPhotos(true);
    if (got.sig !== listSig) { listSig = got.sig; applyList(got); }
    lastCheck = now(); offlineSince = null;
  } catch {
    if (!offlineSince) offlineSince = now();
  } finally {
    checking = false;
    $('chk').textContent = offlineSince ? 'Offline since ' + hm(offlineSince)
      : lastCheck ? 'Checked ' + hm(lastCheck) + ' · ' + photos.length + ' photo' + (photos.length === 1 ? '' : 's') : '';
  }
}

// A new version (new service worker) or the daily fresh start: reload between photos, or now if nothing is playing.
function refreshSoon() {
  if (started && playing && !asleep) reloadPending = true;
  else { saveState(); location.reload(); }
}
setTimeout(refreshSoon, nextAt(3) - +now());   // daily, around 3 am

/* ---------- Start ---------- */
(async () => {
  applyPrefs();
  updateNight();
  setInterval(check, CHECK_MS);
  try {
    vault = await Vault.loadVault();
    ready = true;
    if (vault) {
      encKey = (await Vault.loadKey(vault)) || (await askPassphrase(vault, false));
      $('lockBtn').hidden = false;
      $('msg').hidden = false;
      $('msg').textContent = 'Loading photos…';
    }
    const got = await loadPhotos(false);
    listSig = got.sig;
    setPhotos(got.photos);
    tidyPhotoCache(got.all);
    if (photos.length) begin(); else stopShow(got.all.length);
    lastCheck = now();
  } catch (e) {
    $('msg').textContent = e.message;
  }
})();

// Version number, from VERSION in sw.js (the one place it's changed).
fetch('sw.js', { cache: 'no-cache' }).then(r => r.text()).then(t => {
  const m = t.match(/VERSION\s*=\s*'([^']+?)-v(\d+)'/);
  if (m) document.querySelectorAll('.ver').forEach(e => { e.textContent = e.dataset.name + ' v' + m[2]; e.title = m[1] + '-v' + m[2]; });
}).catch(() => {});

if ('serviceWorker' in navigator) {
  const hadWorker = !!navigator.serviceWorker.controller;   // not on the very first visit
  navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadWorker) refreshSoon(); });
}
</script>
