<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2140"/>
      <stop offset="1" stop-color="#15111f"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6a35c"/>
      <stop offset="1" stop-color="#b3527a"/>
    </linearGradient>
    <clipPath id="photo"><rect x="72" y="112" width="300" height="240" rx="24"/></clipPath>
  </defs>
  <!-- Background (full bleed; iOS rounds the corners itself), matching the slideshow icon -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Photo: sunset sky, sun, mountains -->
  <g clip-path="url(#photo)">
    <rect x="72" y="112" width="300" height="240" fill="url(#sky)"/>
    <circle cx="300" cy="172" r="26" fill="#ffe7a8"/>
    <path d="M72 352 L170 230 L232 300 L276 252 L372 352 Z" fill="#3a2a52"/>
  </g>

  <!-- Padlock badge: the manager encrypts photos -->
  <circle cx="370" cy="350" r="98" fill="#15111f"/>
  <circle cx="370" cy="350" r="84" fill="#ffffff"/>
  <path d="M338 336 V312 a32 32 0 0 1 64 0 V336" fill="none" stroke="#2a2140" stroke-width="16" stroke-linecap="round"/>
  <rect x="320" y="332" width="100" height="74" rx="14" fill="#2a2140"/>
  <circle cx="370" cy="362" r="10" fill="#ffffff"/>
  <rect x="365" y="364" width="10" height="22" rx="4" fill="#ffffff"/>
</svg>
