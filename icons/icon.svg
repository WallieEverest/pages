<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- My Apps: the three app icons in a grid. Rendered to icon-180/192/512.png (see configuration.md). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcdce4"/>
    </linearGradient>
    <clipPath id="tile"><rect width="196" height="196" rx="44"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <g transform="translate(42 42)"><image href="../weather/icons/icon-512.png" width="196" height="196" clip-path="url(#tile)"/></g>
    <g transform="translate(274 42)"><image href="../slideshow/icons/icon-512.png" width="196" height="196" clip-path="url(#tile)"/></g>
    <g transform="translate(158 274)"><image href="../manager/icons/icon-512.png" width="196" height="196" clip-path="url(#tile)"/></g>
  </g>
</svg>
